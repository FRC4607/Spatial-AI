[project]
name="Spatial-AI"
version="0.0.0"
description="OAK-D spatial AI for FRC"
requires-python = ">=3.11"

[project.scripts]
recorder = "spatial_ai.recorder:main" 
replay = "spatial_ai.replay:main"
spatial-inference = "spatial_ai.spatial_inference:main"

[build-system]
requires=["hatchling"]
build-backend="hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spatial_ai"]

[tool.black]
line-length = 120

[tool.pylint.main]
disable = [
    "line-too-long",
]